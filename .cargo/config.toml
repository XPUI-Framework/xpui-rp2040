# Cargo reads this file only when it is invoked from this directory or below,
# so `cargo build` and `cargo run` here target the board and need no `--target`
# flag.
#
# From the repository root there is nothing to read it: this crate is excluded
# from that workspace, so a build there does not reach it at all. The gate uses
# `--manifest-path` and names the target itself.

[build]
target = "thumbv6m-none-eabi" # Cortex-M0+

[target.thumbv6m-none-eabi]
# `cargo run --release --bin badger2040` with a debug probe attached: a
# Raspberry Pi Debug Probe, or a second Pico running picoprobe.
runner = "probe-rs run --chip RP2040 --protocol swd"
# Without a probe, flash over USB instead — hold BOOTSEL while plugging the
# board in, then swap the runner for the line below (or see README.md for the
# two-step form that does not touch this file).
# runner = "elf2uf2-rs --deploy"
