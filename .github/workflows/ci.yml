name: CI

# Every push to `main`, and every pull request. The job below runs
# `./build-and-test.sh`, which is the same script a developer runs — so a green
# tick here means exactly what a green run means locally.
on:
  push:
    branches: [main]
  pull_request:
  # By hand, so a changed runner can be checked without a
  # fake commit.
  workflow_dispatch:

# Read the checkout and nothing else; the gate writes nowhere.
permissions:
  contents: read

# A second push does not pay for the first.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: RP2040 firmware (format, lint, test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # `rust-toolchain.toml` pins the channel, the components and the
      # board's target, so rustup installs them on the first cargo call.
      # Named again so a runner image that ships a partial toolchain fails
      # here, where the reason is one line up, rather than inside the gate.
      - name: Install Rust
        run: |
          rustup show active-toolchain
          rustup target add thumbv6m-none-eabi

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      # ---- the gate --------------------------------------------------------
      #
      # One step, running the same script a developer runs, because two lists
      # of checks drift. Anything CI needs that a laptop does not is setup,
      # above; anything that decides whether the code is good is in the script,
      # where it can be run before pushing.
      - name: Gate
        run: ./build-and-test.sh check
