# Its own repository now, and still its own workspace. It was excluded from the
# monorepo for a reason that has not changed: membership meant a host build,
# and an RP2040 HAL cannot compile for a laptop, so every item here sat behind
# a `device` cfg that no host test could reach and no editor could resolve.
# Standing alone costs a second lock file and the metadata below.
[workspace]

[package]
name = "xpui-rp2040"
description = "The xpui gallery as RP2040 firmware, for the Badger 2040 and the Tufty 2040"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Thiago Holanda <unnamedd@gmail.com>"]
repository = "https://github.com/XPUI-Framework/xpui-rp2040"
readme = "README.md"
publish = false

# `test`/`bench` off on every target: a test harness needs libtest, which does
# not exist for `thumbv6m-none-eabi`, so leaving them on makes
# `--all-targets` fail on the only target this crate compiles for. What is
# testable here lives in xpui and in the gallery, both of which are tested on
# the host.
[lib]
name = "xpui_rp2040"
path = "src/lib.rs"
test = false
bench = false

[[bin]]
name = "badger2040"
path = "src/bin/badger2040.rs"
test = false
bench = false

[[bin]]
name = "tufty2040"
path = "src/bin/tufty2040.rs"
test = false
bench = false

# Unconditional, because nothing here builds for a laptop and nothing asks it
# to. `.cargo/config.toml` sets the target; there is no host build to satisfy.
[dependencies]
xpui = { git = "https://github.com/XPUI-Framework/xpui-framework", branch = "main" }
# Pimoroni only: these two binaries flash a Badger and a Tufty.
xpui-boards-core = { git = "https://github.com/XPUI-Framework/xpui-boards", branch = "main" }
xpui-boards-pimoroni = { git = "https://github.com/XPUI-Framework/xpui-boards", branch = "main" }
# `critical-section` on, because this is a device: an interrupt handler could
# plausibly reach the backend, and on the panel that costs a brief interrupt
# mask rather than aliasing `&mut D`. The implementation comes from
# `embassy-rp` below — the backend depends on the API only, as a library must.
xpui-embedded-graphics = { git = "https://github.com/XPUI-Framework/xpui-backends", branch = "main", features = [
    "critical-section",
] }

# The screens. Package `xpui-gallery`, library `gallery` — the same crate the
# desktop simulator runs, with nothing device-specific in it.
xpui-gallery = { git = "https://github.com/XPUI-Framework/xpui-gallery", branch = "main" }

embedded-graphics = "0.8"

# Embassy: the RP2040 HAL, a microsecond clock, and an executor to await on.
embassy-executor = { version = "0.9.1", features = ["arch-cortex-m", "executor-thread"] }
embassy-rp = { version = "0.8.0", features = ["critical-section-impl", "rp2040", "time-driver"] }
embassy-time = "0.5.1"

cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
# `llff` only: the default set also pulls in `tlsf`, which wants nightly.
embedded-alloc = { version = "0.7.0", default-features = false, features = ["llff"] }
debouncr = "0.2.2"

# A way for a board to say what happened. `probe-rs run` — the runner
# `.cargo/config.toml` names — picks the channel up and prints it in the
# terminal that flashed the firmware, which needs the symbol table the profile
# below keeps. Without any of this the panic handler parks silently and a dead
# board looks exactly like an idle one, which cost a day of guessing at a
# photograph.
rtt-target = "0.6"

# The panels.
uc8151 = "0.2.0"   # Badger 2040, monochrome e-ink over SPI
mipidsi = "0.9.0"  # Tufty 2040, ST7789v over an 8-bit parallel bus

# Inherited from the workspace root until this crate stood alone.
#
# `strip = "debuginfo"` rather than `true`: `probe-rs run` locates the RTT
# control block by looking its symbol up in the ELF, and `strip = true` deletes
# the whole symbol table, so the boot log never appears and the failure looks
# like a firmware that printed nothing. DWARF still goes.
#
# It costs **nothing on the part**. The symbol table is in no loadable segment,
# so what is flashed is byte-identical either way: 223,972 bytes on the Badger
# and 229,716 on the Tufty, measured both ways. The ELF on disk grows by about
# 100 kB, which is host disk and not flash.
[profile.release]
panic = "abort"
# Size over speed: flash is the scarce resource on a 2 MB part, not cycles.
opt-level = "z"
lto = true
codegen-units = 1
strip = "debuginfo"
